<title>Panel interno | D-TEK GT</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#030405;color:#f7f7f5;
       font-family:"Inter","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;padding:24px}
  .card{max-width:440px;text-align:center;background:linear-gradient(150deg,#0d1015,#141920);
        border:1px solid rgba(255,255,255,.11);border-radius:26px;padding:38px 32px;
        box-shadow:0 28px 80px rgba(0,0,0,.38)}
  .kicker{display:inline-flex;align-items:center;gap:9px;font-size:10px;letter-spacing:.16em;
          text-transform:uppercase;color:rgba(247,247,245,.62);margin-bottom:20px}
  .kicker i{width:6px;height:6px;border-radius:50%;background:#ff3b3f;box-shadow:0 0 10px rgba(227,32,37,.55)}
  h1{font-weight:300;font-size:34px;line-height:1;letter-spacing:-.045em;margin:0 0 14px}
  p{color:rgba(247,247,245,.66);font-size:15px;line-height:1.6;margin:0 0 26px}
  a{display:inline-block;background:#e32025;color:#fff;text-decoration:none;font-weight:600;font-size:15px;
    border-radius:999px;padding:13px 26px;transition:transform .3s cubic-bezier(.16,1,.3,1)}
  a:hover{transform:translateY(-2px)}
  a:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(227,32,37,.4)}
</style>

  <div class="card">
    <span class="kicker"><i></i> Acceso interno</span>
