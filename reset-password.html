<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="D-TEK GT / Dominic Morales" />
  <meta name="theme-color" content="#05080d" />
  <title>Nueva contraseña · D-TEK GT</title>
  <link rel="stylesheet" href="styles.css?v=13754629" />
  <style>
    .reset-shell{min-height:100vh;display:grid;place-items:center;padding:24px;position:relative;z-index:2}
    .reset-card{width:min(100%,520px);padding:clamp(24px,5vw,42px);border-radius:26px}
    .reset-card .brand{display:inline-flex;margin-bottom:28px}
    .reset-card h1{margin:0 0 10px;font-size:clamp(2rem,7vw,3.2rem);line-height:1}
    .reset-card .section-lead{margin-bottom:24px}
    .reset-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
    .reset-actions .btn{width:100%;text-align:center}
    .reset-hidden{display:none!important}
    @media(max-width:520px){.reset-actions{grid-template-columns:1fr}.reset-shell{padding:16px}.reset-card{border-radius:22px}}
  </style>
</head>
<body>
  <div class="dtek-bg"><span class="orb orb-red"></span><span class="orb orb-cyan"></span></div>
  <main class="reset-shell">
    <section class="reset-card dtek-glass" aria-labelledby="resetTitle">
      <a class="brand" href="index.html"><img src="assets/logo-dtek.png" alt="D-TEK GT"><span>D-TEK GT</span></a>
      <span class="eyebrow">Acceso seguro</span>
      <h1 id="resetTitle">Creá tu nueva contraseña</h1>
      <p class="section-lead">Debe tener al menos 8 caracteres. Usá una que solo vos conozcás.</p>

      <form id="resetPasswordForm" class="stacked-form reset-hidden">
        <label>Nueva contraseña
          <input id="resetNewPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Mínimo 8 caracteres" />
        </label>
        <label>Confirmar contraseña
          <input id="resetConfirmPassword" type="password" minlength="8" autocomplete="new-password" required placeholder="Repetila" />
        </label>
        <button class="btn btn-primary" id="resetPasswordSubmit" type="submit">Guardar contraseña nueva</button>
      </form>

      <div id="resetPasswordStatus" class="status-box" aria-live="polite">Validando el enlace seguro...</div>

      <div id="resetDoneActions" class="reset-actions reset-hidden">
        <a class="btn btn-primary" href="admin-backend.html">Entrar como administrador</a>
        <a class="btn btn-cyan" href="cliente.html">Entrar a mi Garage</a>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js?v=81e95d5d"></script>
  <script src="supabase-client.js?v=34adfdb1"></script>
  <script src="reset-password.js?v=0ed4ae9a"></script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
